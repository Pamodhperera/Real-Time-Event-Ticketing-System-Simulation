<div class="container">
  <header>
    <h1>🎟️ Event Ticketing System</h1>
  </header>

  <div class="dashboard">
    <div class="status-cards">
      <div class="card">
        <p>Active Vendors</p>
        <h2>{{ activeVendors }}</h2>
        <button (click)="incrementCounter('vendors')">+</button>
        <button (click)="decrementCounter('vendors')">-</button>
      </div>
      <div class="card">
        <p>Active Customers</p>
        <h2>{{ activeCustomers }}</h2>
        <button (click)="incrementCounter('customers')">+</button>
        <button (click)="decrementCounter('customers')">-</button>
      </div>
      <div class="card">
        <p>VIP Customers</p>
        <h2>{{ vipCustomers }}</h2>
        <button (click)="incrementCounter('vip')">+</button>
        <button (click)="decrementCounter('vip')">-</button>
      </div>
    </div>

    <div class="available-tickets">
      <h3>Available Tickets</h3>
<!--      <h2>{{ availableTickets }} / {{ configuration.totalTickets }}</h2>-->
<!--      <p>Total Released: {{ totalReleased }} / {{ configuration.totalTickets }}</p>-->
      <div class="progress-bar">
<!--        <div [style.width.%]="(availableTickets / configuration.totalTickets) * 100"></div>-->
      </div>
    </div>

    <div class="main-content">
      <div class="config">
        <h3>System Configuration</h3>
        <form (ngSubmit)="saveConfiguration()">
          <div>
            <label for="totalTickets">Total Tickets</label>
            <input type="number" id="totalTickets" [(ngModel)]="configuration.totalTickets" name="totalTickets" />
          </div>
          <div>
            <label for="ticketReleaseRate">Ticket Release Rate</label>
            <input type="number" id="ticketReleaseRate" [(ngModel)]="configuration.ticketReleaseRate" name="releaseRate" />
          </div>
          <div>
            <label for="customerRetrievalRate">Customer Retrieval Rate</label>
            <input type="number" id="customerRetrievalRate" [(ngModel)]="configuration.customerRetrievalRate" name="customerRetrievalRate" />
          </div>
          <div>
            <label for="maxTicketCapacity">Max Ticket Capacity</label>
            <input type="number" id="maxTicketCapacity" [(ngModel)]="configuration.maxTicketCapacity" name="maxTicketCapacity" />
          </div>
          <button type="button" (click)="saveConfiguration()">Save</button>
        </form>
      </div>

      <div class="logs">
        <h3>Transaction Logs</h3>
        <div class="logs-display">
          <p *ngFor="let log of logs">{{ log }}</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button type="button" (click)="startSimulation()">Start</button>
      <button type="button" (click)="stopSimulation()">Stop</button>
    </div>

    <div class="real-time-graph">
      <h3>Real-Time Transactions</h3>
      <!-- Placeholder for a real graph library -->
      <div class="graph-placeholder">
        <p>Graph Placeholder: Implement chart.js or similar library</p>
      </div>
    </div>
  </div>
</div>
